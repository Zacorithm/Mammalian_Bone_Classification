optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.001,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 150,
    initial_epochs : 10
}}

dataset: {
  train: { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'train', npoints: 1024 } },
  val:   { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'valid', npoints: 1024 } },
}

model: {
  NAME: SpiderCNN_Classification,
  cls_dim: 14,
  use_class_weights: true,
  label_smoothing: 0.1,
  cls_loss: focal,   # 'ce' (default) | 'focal' — both honour use_class_weights + label_smoothing
  focal_gamma: 2.0,

  # One static kNN graph is built once and shared by all four layers, along
  # with the local offsets `delta`; there is no sampling anywhere in this model.
  in_channels: 3,                   # xyz only (the _cls variant adds normals -> 6)
  k: 20,                            # nsample: neighbours per point
  taylor_channel: 5,                # values the degree-3 Taylor filter emits per neighbour
  G: 16,                            # GroupNorm groups (min(G, channels) is used)
  gn_eps: 0.000001,                 # the reference's group-norm epsilon
  channels: [32, 64, 128, 256],     # one SpiderConv per entry; outputs are concatenated
  topk: 2,                          # top-k pooling over points -> sum(channels)*topk = 960

  fc_dims: [1024, 512],
  # DROP probability. The reference passes keep_prob=0.3 to tf.nn.dropout,
  # which keeps 30% of units, i.e. a drop probability of 0.7 -- that is what
  # reproduces it. Very aggressive for 14 classes / ~5.8k samples; try 0.5
  # first if the model underfits.
  dropout: 0.7
}

npoints: 1024
total_bs: 64                      # The [B, N, k, C*taylor] tensor in the last SpiderConv
                                  # is the memory driver (C=128, taylor=5, k=20)
step_per_update: 1
max_epoch: 150
grad_norm_clip: 10
