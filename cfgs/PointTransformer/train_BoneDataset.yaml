optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.001,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 150,
    initial_epochs : 10
}}

dataset: {
  train: { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'train', npoints: 1024 } },
  val:   { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'valid', npoints: 1024 } },
}

model : {
  NAME: PointTransformerV1_Classification,
  cls_dim: 14,
  use_class_weights: true,
  label_smoothing: 0.1,
  cls_loss: focal,   # 'ce' (default) | 'focal' — both honour use_class_weights + label_smoothing
  focal_gamma: 2.0,
  num_points: 1024,
  in_channels: 3
}

npoints: 1024
total_bs : 64
step_per_update : 1
max_epoch : 150
grad_norm_clip : 10
