optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.001,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 150,
    initial_epochs : 10
}}

dataset: {
  train: { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'train', npoints: 1024 } },
  val:   { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'valid', npoints: 1024 } },
}

model : {
  NAME: PointNeXt_Classification,
  cls_dim: 14,

  # -S is blocks [1,1,1,1,1,1] + sa_layers 2 + sa_use_res true;
  # -B/-L/-XL move the depth into the InvResMLP blocks and turn the SA residual off.
  # -L: blocks [1,3,5,3,3,1]   -XL: blocks [1,4,7,4,4,1] with width 64.
  width: 32,
  blocks:  [1, 2, 3, 2, 2, 1],
  strides: [1, 2, 2, 2, 2, 1],
  block: InvResMLP,
  sa_layers: 1,
  sa_use_res: false,
  expansion: 4,
  use_res: true,

  grouper: ballquery,
  radius: 0.15,
  radius_scaling: 1.5,
  nsample: 32,
  nsample_scaling: 1,
  normalize_dp: true,
  sampler: fps,
  feature_type: 'dp_fj',
  reduction: max,

  head_mlps: [512, 256],
  dropout: 0.5,

  use_class_weights: true,
  label_smoothing: 0.1,
  cls_loss: focal,   # 'ce' (default) | 'focal' — both honour use_class_weights + label_smoothing
  focal_gamma: 2.0,
}

npoints: 1024
total_bs : 32
step_per_update : 1
max_epoch : 150
grad_norm_clip : 10
