optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.001, 
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 10,
}}

temp: {
  start : 1,
  target: 0.0625,
  ntime: 100000 
}

kldweight: {
  start : 0,
  target: 0.1,
  ntime: 100000
}

dataset: {
  train: { _base_: cfgs/dataset_configs/bone_dataset_pretrain.yaml, others: { subset: 'train', npoints: 1024 } },
  val:   { _base_: cfgs/dataset_configs/bone_dataset_pretrain.yaml, others: { subset: 'valid', npoints: 1024 } },
}

model : {
  NAME: PointBERT_DVAE_Pretrain, 
  group_size: 32, 
  num_group: 64,
  loss: cdl12,
  encoder_dims: 384,
  num_tokens: 8192,
  tokens_dims: 384, 
  decoder_dims: 384, 
}

npoints: 1024
total_bs : 128
step_per_update : 1
max_epoch : 300