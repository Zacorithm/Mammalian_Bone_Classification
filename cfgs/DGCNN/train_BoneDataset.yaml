optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.001,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 150,
    initial_epochs : 10
}}

dataset: {
  train: { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'train', npoints: 1024 } },
  val:   { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'valid', npoints: 1024 } },
}

model: {
  NAME: DGCNN_Classification,
  cls_dim: 14,                    # Number of classes (same as Point-MAE)
  k: 20,                         # Number of nearest neighbors for graph construction
  use_class_weights: true,
  label_smoothing: 0.1,
  cls_loss: focal,   # 'ce' (default) | 'focal' — both honour use_class_weights + label_smoothing
  focal_gamma: 2.0,
  emb_dims: 1024,                # width of the fused embedding; pooling concatenates
                                 # max and avg, so the head sees emb_dims * 2
  dropout: 0.5                   # reference default (was 0.3)
}

npoints: 1024
total_bs: 64
step_per_update: 1
max_epoch: 150
grad_norm_clip: 10

# Additional DGCNN_Classification specific parameters (optional)
# You can uncomment and modify these if needed:
# 
# model_specific: {
#   # DGCNN_Classification specific configurations
#   edge_conv_layers: 4,          # Number of EdgeConv layers
#   feature_dims: [64, 64, 128, 256],  # Feature dimensions for each layer
#   use_dynamic_graph: true       # Whether to recompute graph at each layer
# }