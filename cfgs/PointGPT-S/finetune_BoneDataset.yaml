optimizer: { type: AdamW, kwargs: { lr: 0.001, weight_decay: 0.05 } }

scheduler: { type: CosLR, kwargs: { epochs: 150, initial_epochs: 10 } }

dataset: {
  train: { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'train', npoints: 1024 } },
  val:   { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'valid', npoints: 1024 } },
}
            
model:
  {
    NAME: PointGPT_Classification,
    trans_dim: 384,
    depth: 12,
    drop_path_rate: 0.1,
    cls_dim: 14,
    num_heads: 6,
    group_size: 32,
    num_group: 64,
    encoder_dims: 384,
    decoder_depth: 4,
    loss: cdl2,
    use_class_weights: true,
    label_smoothing: 0.1,
    cls_loss: focal,   # 'ce' (default) | 'focal' — both honour use_class_weights + label_smoothing
    focal_gamma: 2.0,
    freeze_encoder: false,
    # total loss = cls_loss_weight * <classification loss>
    #            + gen_loss_weight * (CDL1 + CDL2)
    cls_loss_weight: 1.0,        # coefficient on the classification loss
    gen_loss_weight: 0.0,        # coefficient on the reconstruction (next-patch
                                 # generation) loss from generator_blocks.
                                 # 0 = off; generator_blocks is then not built.
                                 # Upstream PointGPT fine-tuning uses 3.0.
  }

npoints: 1024
total_bs: 64
step_per_update: 1
max_epoch: 150
grad_norm_clip: 10
