optimizer: {
  type: AdamW,
  kwargs: {
    lr: 0.001,
    weight_decay: 0.05
  }
}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 150,
    initial_epochs: 10
  }
}

dataset: {
  train: { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'train', npoints: 1024 } },
  val:   { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'valid', npoints: 1024 } },
}

model: {
  NAME: PointTransformerV2_Classification,
  cls_dim: 14,
  use_class_weights: true,
  label_smoothing: 0.1,
  cls_loss: focal,   # 'ce' (default) | 'focal' — both honour use_class_weights + label_smoothing
  focal_gamma: 2.0,
  num_points: 1024,
  in_channels: 3,
  
  patch_embed_depth: 1,
  patch_embed_channels: 48,
  patch_embed_groups: 6,
  patch_embed_neighbours: 8,

  enc_depths: [2, 2, 6, 2],
  enc_channels: [96, 192, 384, 512],
  enc_groups: [12, 24, 48, 64],
  enc_neighbours: [16, 16, 16, 16],

  grid_sizes: [0.06, 0.12, 0.24, 0.48],

  use_decoder: false,
  dec_depths: [1, 1, 1, 1],
  dec_channels: [48, 96, 192, 384],
  dec_groups: [6, 12, 24, 48],
  dec_neighbours: [16, 16, 16, 16],
  unpool_backend: map,          # 'map' (exact inverse of grid pooling) | 'interp'

  weight_encoding: linear,      # 'linear' (v2m2, recommended) | 'grouped' (v2m1)
  attn_qkv_bias: true,          # NOTE: the model reads `attn_qkv_bias`, not `qkv_bias`
  pe_multiplier: false,
  pe_bias: true,
  attn_drop_rate: 0.0,
  drop_path_rate: 0.3           # reference s3dis value
}

npoints: 1024
total_bs: 64
step_per_update: 1
max_epoch: 150
grad_norm_clip: 10
