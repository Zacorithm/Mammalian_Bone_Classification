optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.001,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 150,
    initial_epochs : 10
}}

dataset: {
  train: { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'train', npoints: 1024 } },
  val:   { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'valid', npoints: 1024 } },
}

model : {
  NAME: Mamba3D_Classification,
  trans_dim: 384,
  depth: 12,
  drop_path_rate: 0.2,
  cls_dim: 14,
  num_heads: 6,
  group_size: 32,
  num_group: 128,
  encoder_dims: 384,
  bimamba_type: "v4",
  center_local_k: 4,
  ordering: False,
  lr_ratio_cls: 1.,
  lr_ratio_lfa: 1.,
  use_class_weights: true,
  label_smoothing: 0.1,
  cls_loss: focal,   # 'ce' (default) | 'focal' — both honour use_class_weights + label_smoothing
  focal_gamma: 2.0,
  freeze_encoder: false
}


npoints: 1024
total_bs : 64
step_per_update : 1
max_epoch : 150
grad_norm_clip : 10
