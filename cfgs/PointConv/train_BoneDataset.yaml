optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.001,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 150,
    initial_epochs : 10
}}

dataset: {
  train: { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'train', npoints: 1024 } },
  val:   { _base_: cfgs/dataset_configs/bone_dataset_config.yaml, others: { subset: 'valid', npoints: 1024 } },
}

model: {
  NAME: PointConv_Classification,
  cls_dim: 14,
  use_class_weights: true,
  label_smoothing: 0.1,
  cls_loss: focal,   # 'ce' (default) | 'focal' — both honour use_class_weights + label_smoothing
  focal_gamma: 2.0,

  #   npoint     = centres kept by farthest-point sampling
  #   nsample    = kNN neighbours per centre (ignored when group_all)
  #   mlp        = per-neighbour conv widths; mlp[-1] is also the layer output,
  #                and the trailing Linear(16*mlp[-1] -> mlp[-1]) — the paper's
  #                efficient reformulation — holds most of the parameters
  #   bandwidth  = Gaussian bandwidth of the density estimate (over ALL points)
  #   group_all  = last stage: one centre at the cloud centroid, every point grouped
  # BoneDataset normalizes to the unit sphere, the same scale as the
  # reference's ModelNet40 input, so these bandwidths transfer unchanged.
  stages: [
    { npoint: 512, nsample: 32,   mlp: [64, 64, 128],    bandwidth: 0.1, group_all: false },
    { npoint: 128, nsample: 64,   mlp: [128, 128, 256],  bandwidth: 0.2, group_all: false },
    { npoint: 1,   nsample: null, mlp: [256, 512, 1024], bandwidth: 0.4, group_all: true  }
  ],

  feature_dim: 3,

  weightnet_hidden: [8, 8],         # WeightNet 3 -> 8 -> 8 -> weightnet_out
  weightnet_out: 16,
  density_hidden: [16, 8],          # DensityNet 1 -> 16 -> 8 -> 1
  density_activation: relu,

  fc_dims: [512, 256],
  dropout: 0.7                      # the reference's value (nn.Dropout(0.7))
}

npoints: 1024
total_bs: 64                      # The trailing Linear of the last stage
                                  # (16*1024 -> 1024) dominates both memory and params
step_per_update: 1
max_epoch: 150
grad_norm_clip: 10
